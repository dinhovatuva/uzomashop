    <div class="content-header">

          <div class="col-sm-6">
            <h1 class="m-0 text-dark">Usuários </h1>
          </div><!-- /.col -->
          
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>

<!-- Main content -->
<div class="content">
      <div class="container-fluid">
        <div class="row">
  	<div class="col-md-12">
  		<div class="card">
        <div class="card-header with-border">
          <h3 class="card-title">Novo Usuário</h3>
        </div>
        <!-- /.box-header -->
        <!-- form start -->
        <form role="form" action="/config/user/new" method="post">
          <div class="card-body">
            <div class="form-group">
              <label for="nome">Nome</label>
              <input type="text" class="form-control" id="name" name="name" maxlength="60" required="required">
            </div>
            <div class="form-group">
              <label for="usuario">Usuario</label>
              <input type="text" class="form-control" id="user" name="user" maxlength="30" required="required">
            </div>
            <div class="form-group">
              <label for="usuario">Email</label>
              <input type="email" class="form-control" id="email" name="email" maxlength="60" required="required">
            </div>
            <div class="form-group">
              <label for="usuario">Tel</label>
              <input type="text" class="form-control" id="tel" name="tel" maxlength="30">
            </div>
            <div class="form-group">
              <label for="password">Senha: 12345</label>
            </div>
           
          </div>
          <!-- /.box-body -->
          <div class="card-footer">
            <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>

        </form>
      </div>
