        <div class="card-header with-border">
          <h3 class="card-title">Novo Parceiro</h3>
        </div>
        <!-- /.card-header -->

        <form role="form" action="/config/client/new" method="post" enctype="multipart/form-data">

              <input type="text" class="form-control" id="name" name="name" maxlength="120" required="required">

            <div class="form-group">
               <label for="description">Testemunho</label>
               <textarea id="compose-textarea" class="form-control" name="note" style="height: 200px"></textarea>
            </div>
          </div>
          <!-- /.card-body -->
          <div class="card-footer">
            <button type="submit" class="btn btn-primary">Cadastrar</button>
          </div>
        </form>
      </div>

      </div><!-- /.container-fluid -->
