<!doctype html>
<html lang="pt">
<head>
    <title>Uzomashop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Uzomashop é uma plataforma digital angolana que possibilita aos residentes fazer compras de produtos diversos sem ter que se deslocar.">
    <meta name="title" content="Uzomashop | "/>
    <meta name="keywords" content="Uzoma, Shop, Uzomashop, Compras Online, Luanda"/>
    <meta name="author" content="Adolfo Vatuva">
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Portuguese" />
    <meta property="og:image" content="/img/ico-black.png">
    
    <link href="/assets/site/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/site/css/font-awesome.min.css" rel="stylesheet">
    <link href="/assets/site/css/prettyPhoto.css" rel="stylesheet">
    <link href="/assets/site/css/price-range.css" rel="stylesheet">
    <link href="/assets/site/css/animate.css" rel="stylesheet">
    <link href="/assets/site/css/mainv1.css" rel="stylesheet">
    <link href="/assets/site/css/responsive.css" rel="stylesheet">
         
    <link rel="shortcut icon" href="/img/ico-black.png">

    <script src="/assets/site/js/jquery.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>
  <header id="header"><!--header-->
    <div class="header_top"><!--header_top-->
      <div class="container">
        <div class="row">
          <div class="col-md-11 col-xs-10">
            <div class="contactinfo">
              <ul class="nav nav-pills">
                <li><a href="#"><i class="fa fa-map-marker"></i>
                    {$company.address}
                    </a>
                </li>
              </ul>
            </div>
          </div>
          <div class="col-md-1 col-xs-2 ">
            <div class="social-icons">
              
              <div class="btn-group">
                <button type="button" class="btn btn-link dropdown-toggle" data-toggle="dropdown" style="color:#000">
                  <i class="fa fa-list" data-toggle="dropdown-menu"></i>
                  
                </button>
                <ul class="dropdown-menu">
                  <li><a href="/login">Registo de Cliente</a></li><br>
                  <li><a href="/vendedor">Registo de Vendedor</a></li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div><!--/header_top-->
    
    <div class="header-middle"><!--header-middle-->
      <div class="container">
        <div class="row">
          <div class="col-md-4 col-sm-4 col-xs-12">
            <div class="logo text-left">
              <a href="/home"><img src="/img/logo-black.png" alt="" width="139" /></a>
            </div>
          </div>
          <div class="col-md-8 col-sm-8 hidden-xs">
            <div class="shop-menu">
              <ul class="nav navbar-nav navbar-right">
                <li><a href="#"><i class="fa fa-phone"></i>
                    {loop="$contact"}
                      {if="$value.description=='tel'"} {$value.contact} {/if}
                    {/loop}
                    </a>
                </li>
                <li><a href="/carrinho/finalizar"><i class="fa fa-crosshairs"></i> Finalizar Compra</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div><!--/header-middle-->
  
    <div class="header-bottom"><!--header-bottom-->
      <div class="container">
        <div class="row">
          <div class="col-md-2 col-xs-2 btn-menu border-light-left">
            <!-- Single button -->
            <div class="btn-group">
              <button type="button" class="btn btn-link dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <h4><span class="fa fa-list-alt" aria-hidden="true"></span> 
                  <span class="hidden-xs2 hidden-sm2">Categorias</span> <i class="carret"></i> </h4>
              </button>
              <ul class="dropdown-menu">
                {loop="$category"}
                <li><a href="/produtos?categoria={$value.num}">{$value.category}</a></li>
                {/loop} 
              </ul>
            </div>
          </div>
          <div class="col-md-7 col-xs-8">
               <form class="search-form" action="/produtos" method="get">
                <div class="input-group">
                  <input type="text" class="form-control" name="search" placeholder="O que voce procura?">
                  <div class="input-group-btn">
                    <button class="btn btn-default" type="submit">
                      <i class="glyphicon glyphicon-search"></i>
                    </button>
                  </div>
                </div>
            </form>
          </div>
          <div class="col-md-2 col-xs-1 btn-menu text-right border-light-right">
            <!-- Single button -->
            <div class="btn-group ">
              <button type="button" class="btn btn-link">
                <a href="/carrinho" style="color: #D67D3E"><h4>
                  <i class="fa fa-shopping-cart"><sup>{$numrowcart.total}</sup></i> 
                  <span class="hidden-xs2 hidden-sm2">
                    Carrinho </span></h4></a>
              </button>
              
            </div>
          </div>
          <div class="col-md-1 col-xs-1 btn-menu border-light-right">
            <!-- Single button -->
            <div class="btn-group">
              <button type="button" class="btn btn-link">
                <a href="/login" style="color: #D67D3E"><h4><i class="fa fa-user"></i>
                <span class="hidden-xs2 hidden-sm2">
                   Conta </span></h4></a>
              </button>
              
            </div>
          </div>
        </div>
      </div>
    </div><!--/header-bottom-->
  </header><!--/header-->
