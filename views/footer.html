  <script>   
    $(document).ready(function(){
         //mascara para valores monitários
         $('.money').mask('000.000.000,00', {reverse: true});
         //verificando se as senhas são iguas
         $('#senha2').keyup(function(){
            if($('#senha').val() != $('#senha2').val()){
              $('#verifypass').html('Senhas diferentes');
              $('#btn-enviar').attr("disabled", true);
            }else{
              $('#verifypass').html('');
              $('#btn-enviar').attr("disabled", false);
            }
         });
        //Verificando se o número de telefone já existe
        $('#numtelefone').keyup(function(){
            var num = $('#numtelefone').val();
            $.ajax({
                url:"/verifyuser",
                type: "GET",
                data:{"num": num},
                success:function(data)
            {
                $('#verifynum').html(data); 
            }  
            });   
        });
        //colocando o menu fixo
        $(window).scroll(function() { 
        var scroll = $(window).scrollTop();
        
        if (scroll > 160) {
            $('#header').addClass('navbar navbar-fixed-top navbar-default');
            $('.header-middle').css({'display':'none'});
            $('.header_top').css({'display':'none'});
        } else {
            $('#header').removeClass('navbar navbar-fixed-top navbar-default');
            $('.header-middle').css({'display':'block'});
            $('.header_top').css({'display':'block'});
        }
        });
        $('#search').keyup(function(){
            if($(this).val() != '' && $(this).val() != ' '){

                var search = $(this).val();

                $.ajax({
                    url:'/produtos/sugest',
                    type: "GET",
                    data: {'search' : search},
                    success:function(data)
                    {
                        $('#suggestions').fadeIn();
                        $('#suggestions').html(data); 
                    }  
                });
            }
        });
        /*$(document).on('click','.link-sugest',function(){
        
                $('#search').val(this.text);
                $('#suggestions').fadeOut();
                return false;
        });*/
        
    });
    </script>
